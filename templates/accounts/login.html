{% extends 'base.html' %}
{% block title %}Acceso Administrativo - Comensia{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 420px;">
  <div class="text-center mb-4">
    <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:72px;height:72px;background:var(--brand);color:white;">
      <i class="bi bi-lock-fill fs-3"></i>
    </div>
    <h3 class="fw-bold">Panel Administrativo</h3>
    <p class="text-muted small">Acceso restringido a personal autorizado</p>
  </div>
  <div class="card border-0 shadow">
    <div class="card-body p-4">
      {% if form.errors %}
      <div class="alert alert-danger small">Usuario o contraseña incorrectos.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Usuario</label>
          <input type="text" name="username" class="form-control form-control-lg" autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Contraseña</label>
          <input type="password" name="password" class="form-control form-control-lg">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-brand w-100 py-3 fw-bold">
          <i class="bi bi-box-arrow-in-right"></i> Ingresar
        </button>
      </form>
    </div>
  </div>
  <p class="text-center mt-3"><a href="{% url 'inicio' %}" class="text-muted small">← Volver al sitio</a></p>
</div>
{% endblock %}
